<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">誌</div><div><h1>工作日誌年曆 <span class="version-badge">v15</span></h1><small>LOCAL · PRIVATE · OFFLINE</small></div></div>
    <nav class="year-nav" aria-label="切換年份"><button class="icon-btn" id="prevYear" aria-label="上一年">‹</button><strong id="yearLabel">2026</strong><button class="icon-btn" id="nextYear" aria-label="下一年">›</button></nav>
    <div class="topbar-controls"><span class="toolbar-label">狀態</span><div class="segmented" aria-label="狀態篩選"><button class="status-btn active" data-status="all">全部</button><button class="status-btn" data-status="pending">待辦</button><button class="status-btn" data-status="logged">日期記事</button></div><div class="segmented" aria-label="檢視方式"><button class="seg-btn active" data-view="grid">年度總覽</button><button class="seg-btn" data-view="sheet">Excel 橫向</button></div><div class="date-jump"><input id="jumpDate" type="date" aria-label="指定日期"><button type="button" class="ghost-btn" id="jumpDateBtn">前往</button></div><button class="ghost-btn" id="todayBtn">回到今天</button></div>
    <button class="ghost-btn mobile-filter" id="mobileFilterBtn">標籤</button>
    <button class="ghost-btn" id="settingsBtn" aria-expanded="false">⋯ <span class="desktop-label">資料</span></button>
    <button class="primary-btn" id="addBtn"><span>＋</span>新增項目</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="搜尋記事或說明"></div><div class="side-title"><h2>快速篩選</h2></div><div class="filter-list quick-filter-list" id="quickFilterList"></div><div class="side-title"><h2>標籤篩選</h2><button class="text-btn" id="clearFilters">全部顯示</button></div><div class="filter-list" id="filterList"></div><div class="side-note"><strong>拖曳即可排程</strong><br>把月底待辦拖到日期，即可安排時程；也可將記事拖回待辦區。</div></aside>
    <main class="main"><div class="toolbar stats-toolbar"><div class="stats" id="stats"></div></div><div class="result-nav hidden" id="resultNav"><div class="nav-info"><strong class="nav-filter" id="navFilterLabel"></strong><span class="nav-position" id="navPosition"></span><span class="nav-current" id="navCurrent"></span></div><div class="nav-actions"><button class="nav-btn" id="prevResult">‹ 上一筆 <kbd>P</kbd></button><button class="nav-btn" id="nextResult">下一筆 › <kbd>N</kbd></button><button class="nav-btn" id="listResultsBtn" aria-expanded="false">查看清單</button></div><div class="result-list hidden" id="resultList"></div></div><div class="calendar-frame"><div class="sheet-header hidden" id="sheetHeader" aria-hidden="true"><div class="sheet-header-track" id="sheetHeaderTrack"></div></div><section class="calendar" id="calendar" aria-live="polite"></section></div></main>
  </div>
  <div class="menu" id="settingsMenu"><button id="exportBtn">⇧ 匯出備份（JSON）</button><label>⇩ 匯入備份<input id="importInput" type="file" accept="application/json,.json" hidden></label><button id="printBtn">▣ 列印目前畫面</button><hr><button id="resetBtn">↺ 恢復附件範例</button><small>資料只儲存在這台裝置的瀏覽器。建議定期匯出備份。</small></div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">新增項目</h2><button class="icon-btn" id="closeModal" aria-label="關閉">×</button></div><form id="entryForm"><div class="modal-body"><input type="hidden" id="entryId"><div class="copy-notice hidden" id="copyNotice">正在建立副本。請確認日期或月份後，再按「新增副本」；原項目不會被修改。</div><div class="field"><label>項目類型</label><div class="type-switch"><label><input type="radio" name="entryStatus" value="pending"><span>本月待辦</span></label><label><input type="radio" name="entryStatus" value="logged" checked><span>日期記事</span></label></div></div><div class="field-row"><div class="field" id="dateField"><label for="entryDate">指定日期</label><input id="entryDate" type="date"></div><div class="field hidden" id="monthField"><label for="entryMonth">所屬月份</label><input id="entryMonth" type="month"></div><div class="field"><label for="entryTags">標籤</label><div class="tag-picker" id="tagPicker"><div class="selected-tag-list" id="selectedTagList"></div><input id="entryTags" type="text" autocomplete="off" placeholder="點選既有標籤或輸入新名稱"><div class="tag-suggestions" id="tagSuggestions"></div></div><span class="hint">點選既有標籤；建立新標籤時，輸入名稱後按 Enter。</span></div></div><div class="countdown-setting"><label for="entryCountdown"><input id="entryCountdown" type="checkbox" aria-describedby="countdownHint">顯示倒數日</label><span class="hint" id="countdownHint">依今天日期計算，明天為 1 天；當天顯示「今天」，過期後隱藏。</span></div><div class="field"><label for="entryTitle">記事</label><input id="entryTitle" type="text" maxlength="120" placeholder="要處理的工作或行程" required></div><div class="field"><label for="entryDesc">說明</label><textarea id="entryDesc" maxlength="1200" placeholder="補充背景、進度、待辦事項或相關人員……"></textarea><span class="hint">確定時程後，可將待辦拖到日期格；尚未排程則留在月份待辦。</span></div></div><div class="modal-actions"><button type="button" class="danger-btn" id="deleteBtn">刪除</button><button type="button" class="postpone-btn" id="postponeBtn">延至下月</button><button type="button" class="copy-btn" id="copyBtn">⧉ 複製成新項目</button><button type="button" class="ghost-btn" id="cancelBtn">取消</button><button type="submit" class="primary-btn" id="saveEntryBtn">儲存項目</button></div></form></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const STORAGE_KEY='offlineWorkJournal.v1';
    const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    const weekdays=['日','一','二','三','四','五','六'];
    const colors=['#a6532e','#b56a45','#8a6a3d','#7d5a83','#6d7890','#9a6a27','#6f7655','#96515c','#596b8f','#7b704d'];
    const $=id=>document.getElementById(id);
    const loggedSeed=[
      {date:'2026-01-02',title:'開始整理',description:'整理前一年度保留案件，確認各項資料是否齊備。',tags:['114保留']},
      {date:'2026-01-02',title:'文婷提供資料',description:'收支估計編製資料到齊後再開始核對。',tags:['115收支估計']},
      {date:'2026-01-05',title:'公布法定預算',description:'確認公告版本與核定數一致。',tags:['114法定預算']},
      {date:'2026-02-02',title:'創稿：書面報告',description:'依附件格式完成第一版。',tags:['114法定預算']},
      {date:'2026-02-02',title:'創稿：附帶決議辦理情形表',description:'彙整各單位回復內容。',tags:['114法定預算']},
      {date:'2026-03-02',title:'開始編製底稿',description:'先建立計算底表與資料檢核欄。',tags:['116概算']},
      {date:'2026-03-09',title:'校務座談會',description:'會前確認簡報與提問資料。',tags:['會議']},
      {date:'2026-04-15',title:'開始校對艾富紙本',description:'同步核對系統數字與紙本表格。',tags:['116概算']},
      {date:'2026-05-06',title:'綠色國際大學資料給亦涵',description:'完成索資後留存回覆版本。',tags:['索資']},
      {date:'2026-06-18',title:'初審申復',description:'整理初審意見、申復理由與佐證資料。',tags:['116概算']},
      {date:'2026-07-20',title:'上傳系統並寄出紙本',description:'上傳後截圖留存，確認紙本寄送單號。',tags:['116預算案']},
      {date:'2026-09-24',title:'期初校務會議',description:'準備會議資料並追蹤會後分辦。',tags:['會議']}
    ].map((x,i)=>({...x,status:'logged',id:'sample-'+i,createdAt:Date.now()+i}));
    const pendingSeed=[
      {month:'2026-08',title:'完成預算總說明定稿',description:'待各單位資料回齊後進行最後核對。',tags:['116預算案']},
      {month:'2026-08',title:'整理立法院詢答資料',description:'先彙整可能提問及前一年度答覆。',tags:['116預算案']},
      {month:'2026-09',title:'追蹤財務規劃報告',description:'確認承辦人回覆及提交版本。',tags:['索資']},
      {month:'2026-11',title:'準備年度預算分配底稿',description:'先整理可用額度及例行性支出。',tags:['預算分配']}
    ].map((x,i)=>({...x,status:'pending',id:'todo-'+i,createdAt:Date.now()+100+i}));
    const seed=[...loggedSeed,...pendingSeed];
    let state={entries:[],year:new Date().getFullYear(),selectedTags:[],untaggedFilter:false,countdownFilter:false,query:'',view:'grid',statusFilter:'all'};
    let toastTimer,searchNavTimer,countdownTimer,modalTags=[],navEntryId='',copySourceId='';

    function normalizeEntry(entry){
      const item={...entry,tags:Array.isArray(entry.tags)?entry.tags:[],showCountdown:entry.showCountdown===true};
      if(item.status==='pending'){
        item.month=item.month||(item.date||'').slice(0,7);
        delete item.date;
      }else{
        item.status='logged';
        if(!item.date&&item.month)item.date=item.month+'-01';
        delete item.month;
      }
      return item;
    }
    function load(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
        if(saved&&Array.isArray(saved.entries))state={...state,...saved,entries:saved.entries.map(normalizeEntry)};
        else state.entries=seed.map(normalizeEntry);
      }catch(e){state.entries=seed.map(normalizeEntry)}
      if(!Number.isInteger(state.year))state.year=new Date().getFullYear();
      if(!['all','pending','logged'].includes(state.statusFilter))state.statusFilter='all';
      if(typeof state.untaggedFilter!=='boolean')state.untaggedFilter=false;
      if(typeof state.countdownFilter!=='boolean')state.countdownFilter=false;
    }
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    function uid(){return crypto.randomUUID?crypto.randomUUID():'e-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function tagColor(tag){let n=0;for(const c of tag)n=(n*31+c.charCodeAt(0))>>>0;return colors[n%colors.length]}
    function softColor(hex){const h=hex.slice(1),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},.13)`}
    function dateString(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
    function monthString(y,m){return `${y}-${String(m+1).padStart(2,'0')}`}
    // Count local calendar dates, not elapsed hours (also safe across DST).
    function calendarDayNumber(value){
      const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');
      if(!match)return null;
      const [,y,m,d]=match.map(Number),date=new Date(0);
      date.setUTCFullYear(y,m-1,d);
      if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)return null;
      return date.getTime()/86400000;
    }
    function countdownDays(entry,now=new Date()){
      if(entry.showCountdown!==true||entry.status!=='logged')return null;
      const target=calendarDayNumber(entry.date),today=calendarDayNumber(dateString(now.getFullYear(),now.getMonth(),now.getDate()));
      if(target===null||today===null)return null;
      const days=target-today;
      return days>=0?days:null;
    }
    function countdownMarkup(entry,now=new Date()){
      const days=countdownDays(entry,now);
      if(days===null)return '';
      return `<span class="countdown-badge${days===0?' countdown-today':''}" aria-label="${days===0?'今天，倒數 0 天':`還有 ${days} 天`}" title="日期：${esc(entry.date)}；依今天日期計算">${days===0?'今天':`還有 <strong>${days}</strong> 天`}</span>`;
    }
    function refreshCountdowns(){
      if(state.countdownFilter){render();return}
      const now=new Date(),entries=new Map(state.entries.map(entry=>[entry.id,entry]));
      document.querySelectorAll('.entry[data-entry-id]').forEach(card=>{
        const entry=entries.get(card.dataset.entryId),slot=card.querySelector('.countdown-slot');
        if(slot&&entry){const markup=countdownMarkup(entry,now);if(slot.innerHTML!==markup)slot.innerHTML=markup}
      });
      const today=dateString(now.getFullYear(),now.getMonth(),now.getDate());
      document.querySelectorAll('.day-row').forEach(row=>row.classList.toggle('today',row.dataset.date===today));
    }
    function scheduleCountdownRefresh(){
      clearTimeout(countdownTimer);
      const now=new Date(),midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
      countdownTimer=setTimeout(()=>{refreshCountdowns();scheduleCountdownRefresh()},midnight.getTime()-now.getTime()+250);
    }
    function resumeCountdowns(){refreshCountdowns();scheduleCountdownRefresh()}
    function entryPeriod(e){return e.status==='pending'?e.month:e.date}
    function allTags(){const map={};state.entries.forEach(e=>(e.tags||[]).forEach(t=>map[t]=(map[t]||0)+1));return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'))}
    function canonicalTag(raw){
      const clean=String(raw||'').trim();
      if(!clean)return '';
      const existing=allTags().find(([tag])=>tag.toLocaleLowerCase()===clean.toLocaleLowerCase());
      return existing?existing[0]:clean;
    }
    function addModalTag(raw){
      const tag=canonicalTag(raw);
      if(tag&&!modalTags.some(t=>t.toLocaleLowerCase()===tag.toLocaleLowerCase()))modalTags.push(tag);
      $('entryTags').value='';renderTagPicker();
    }
    function removeModalTag(tag){modalTags=modalTags.filter(t=>t!==tag);renderTagPicker()}
    function commitTagInput(){
      const values=$('entryTags').value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
      values.forEach(value=>{const tag=canonicalTag(value);if(tag&&!modalTags.some(t=>t.toLocaleLowerCase()===tag.toLocaleLowerCase()))modalTags.push(tag)});
      $('entryTags').value='';renderTagPicker();
    }
    function renderTagPicker(){
      const query=$('entryTags').value.trim(),lower=query.toLocaleLowerCase();
      $('selectedTagList').innerHTML=modalTags.map(tag=>`<button type="button" class="selected-tag" data-remove-tag="${esc(tag)}" title="移除 ${esc(tag)}"><span style="color:${tagColor(tag)}">●</span>${esc(tag)}<b>×</b></button>`).join('');
      const tags=allTags().filter(([tag])=>!query||tag.toLocaleLowerCase().includes(lower));
      const exact=query&&allTags().some(([tag])=>tag.toLocaleLowerCase()===lower);
      let html=tags.map(([tag,count])=>{const selected=modalTags.includes(tag);return `<button type="button" class="tag-option${selected?' selected':''}" data-pick-tag="${esc(tag)}"><span class="tag-check">✓</span><span class="tag-dot" style="background:${tagColor(tag)}"></span><span class="tag-name">${esc(tag)}</span><span class="tag-uses">使用 ${count} 次</span></button>`}).join('');
      if(query&&!exact)html+=`<button type="button" class="tag-option create-tag" data-create-tag="${esc(query)}">＋ 建立「${esc(query)}」</button>`;
      $('tagSuggestions').innerHTML=html||'<div class="tag-empty">目前沒有符合的既有標籤</div>';
      document.querySelectorAll('[data-remove-tag]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();removeModalTag(b.dataset.removeTag)}));
      document.querySelectorAll('[data-pick-tag]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const tag=b.dataset.pickTag;modalTags.includes(tag)?removeModalTag(tag):addModalTag(tag);$('entryTags').focus()}));
      document.querySelectorAll('[data-create-tag]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();addModalTag(b.dataset.createTag);$('entryTags').focus()}));
    }
    function isVisible(e){
      const q=state.query.trim().toLowerCase();
      const queryOK=!q||`${e.title} ${e.description||''} ${(e.tags||[]).join(' ')}`.toLowerCase().includes(q);
      const hasTagFilter=state.selectedTags.length||state.untaggedFilter;
      const tagsOK=!hasTagFilter||state.selectedTags.some(t=>(e.tags||[]).includes(t))||(state.untaggedFilter&&!(e.tags||[]).length);
      const statusOK=state.statusFilter==='all'||e.status===state.statusFilter;
      const countdownOK=!state.countdownFilter||countdownDays(e)!==null;
      return queryOK&&tagsOK&&statusOK&&countdownOK;
    }
    function visibleYearEntries(){return state.entries.filter(e=>Number((entryPeriod(e)||'').slice(0,4))===state.year&&isVisible(e))}
    function hasActiveFilter(){return Boolean(state.selectedTags.length||state.untaggedFilter||state.countdownFilter||state.query.trim()||state.statusFilter!=='all')}
    function navigationEntries(){
      return state.entries.filter(isVisible).sort((a,b)=>{
        const aKey=a.status==='pending'?`${a.month}-99`:a.date,bKey=b.status==='pending'?`${b.month}-99`:b.date;
        return aKey.localeCompare(bKey)||(a.createdAt||0)-(b.createdAt||0)||a.title.localeCompare(b.title,'zh-Hant');
      });
    }
    function navigationLabel(){
      const parts=[];
      if(state.countdownFilter)parts.push('倒數項目');
      if(state.selectedTags.length)parts.push(state.selectedTags.join('、'));
      if(state.untaggedFilter)parts.push('無標籤');
      if(state.query.trim())parts.push(`「${state.query.trim()}」`);
      if(state.statusFilter==='pending')parts.push('待辦');
      if(state.statusFilter==='logged')parts.push('日期記事');
      return parts.join('＋')||'篩選結果';
    }
    function navigationDate(e){return e.status==='pending'?`${formatMonth(e.month)}待辦`:formatDate(e.date)}
    function findEntryCard(id){return [...document.querySelectorAll('[data-entry-id]')].find(card=>card.dataset.entryId===id)}
    function markNavigationCard(scroll=false){
      document.querySelectorAll('.entry.nav-active').forEach(card=>card.classList.remove('nav-active'));
      const card=findEntryCard(navEntryId);
      if(!card)return;
      card.classList.add('nav-active');
      if(scroll)card.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
    }
    function renderNavigator(){
      const active=hasActiveFilter(),entries=navigationEntries();
      $('resultNav').classList.toggle('hidden',!active);
      if(!active){navEntryId='';$('resultList').classList.add('hidden');$('listResultsBtn').setAttribute('aria-expanded','false');return}
      let index=entries.findIndex(entry=>entry.id===navEntryId);
      if(index<0&&entries.length){index=0;navEntryId=entries[0].id}
      if(!entries.length){index=-1;navEntryId=''}
      $('navFilterLabel').textContent=navigationLabel();
      $('navPosition').textContent=entries.length?`第 ${index+1}／${entries.length} 筆`:'0 筆';
      $('navCurrent').textContent=index>=0?`${navigationDate(entries[index])}　${entries[index].title}`:'沒有符合的項目';
      $('prevResult').disabled=index<=0;
      $('nextResult').disabled=index<0||index>=entries.length-1;
      $('listResultsBtn').disabled=!entries.length;
      $('resultList').innerHTML=entries.length?entries.map(entry=>`<button type="button" class="result-item${entry.id===navEntryId?' active':''}" data-nav-entry="${esc(entry.id)}"><span class="result-date">${esc(navigationDate(entry))}</span><span class="result-state${entry.status==='pending'?' pending':''}">${entry.status==='pending'?'待辦':'日期記事'}</span><span class="result-title">${esc(entry.title)}</span></button>`).join(''):'<div class="result-empty">沒有符合目前條件的項目</div>';
      document.querySelectorAll('[data-nav-entry]').forEach(button=>button.addEventListener('click',()=>{focusNavigationEntry(button.dataset.navEntry,true);setResultListOpen(false)}));
      markNavigationCard(false);
    }
    function focusNavigationEntry(id,scroll=true){
      const entry=state.entries.find(item=>item.id===id);if(!entry)return;
      navEntryId=id;
      const targetYear=Number((entryPeriod(entry)||'').slice(0,4));
      if(state.year!==targetYear){state.year=targetYear;save();render()}
      else renderNavigator();
      requestAnimationFrame(()=>requestAnimationFrame(()=>markNavigationCard(scroll)));
    }
    function moveNavigation(step){
      const entries=navigationEntries();if(!entries.length)return;
      let index=entries.findIndex(entry=>entry.id===navEntryId);if(index<0)index=0;
      const next=Math.max(0,Math.min(entries.length-1,index+step));
      if(next!==index||!navEntryId)focusNavigationEntry(entries[next].id,true);
    }
    function resetNavigation(autoFocus=false){
      navEntryId='';render();
      if(autoFocus){const first=navigationEntries()[0];if(first)focusNavigationEntry(first.id,true)}
    }
    function setResultListOpen(open){
      $('resultList').classList.toggle('hidden',!open);
      $('listResultsBtn').setAttribute('aria-expanded',String(open));
    }
    function syncSheetHeader(){
      const topbar=document.querySelector('.topbar');
      document.documentElement.style.setProperty('--topbar-height',`${topbar.offsetHeight}px`);
      $('sheetHeaderTrack').style.transform=`translateX(-${$('calendar').scrollLeft}px)`;
    }
    function renderSheetHeader(){
      const sheet=state.view==='sheet';
      $('sheetHeader').classList.toggle('hidden',!sheet);$('sheetHeader').setAttribute('aria-hidden',String(!sheet));
      if(!sheet){$('sheetHeaderTrack').innerHTML='';return}
      const headers=[...$('calendar').querySelectorAll('.month > .month-head')];
      $('sheetHeaderTrack').innerHTML=headers.map(header=>`<header class="month-head sheet-month-head">${header.innerHTML}</header>`).join('');
      requestAnimationFrame(syncSheetHeader);
    }

    function render(){
      $('yearLabel').textContent=state.year;
      $('calendar').className='calendar'+(state.view==='sheet'?' sheet':'');
      document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
      document.querySelectorAll('.status-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===state.statusFilter));
      renderFilters();renderCalendar();renderNavigator();
    }
    function renderFilters(){
      const tags=allTags();
      const now=new Date(),countdownCount=state.entries.filter(entry=>countdownDays(entry,now)!==null).length;
      $('quickFilterList').innerHTML=`<div class="filter-item"><label class="filter-toggle"><input type="checkbox" id="countdownFilter" ${state.countdownFilter?'checked':''}><span class="check">✓</span><span class="tag-dot" style="background:var(--brand)"></span><span class="filter-name" title="只顯示目前有倒數徽章的卡片">倒數項目</span><span class="count">${countdownCount}</span></label></div>`;
      const untaggedCount=state.entries.filter(entry=>!(entry.tags||[]).length).length;
      const untaggedRow=`<div class="filter-item"><label class="filter-toggle"><input type="checkbox" id="untaggedFilter" ${state.untaggedFilter?'checked':''}><span class="check">✓</span><span class="tag-dot" style="background:#9aa4a3"></span><span class="filter-name" title="篩選未設定標籤的項目">無標籤</span><span class="count">${untaggedCount}</span></label></div>`;
      const tagRows=tags.map(([tag,count])=>`<div class="filter-item"><label class="filter-toggle"><input type="checkbox" data-tag="${esc(tag)}" ${state.selectedTags.includes(tag)?'checked':''}><span class="check">✓</span><span class="tag-dot" style="background:${tagColor(tag)}"></span><span class="filter-name" title="${esc(tag)}">${esc(tag)}</span><span class="count">${count}</span></label><button type="button" class="tag-edit" data-rename-tag="${esc(tag)}" aria-label="重新命名標籤 ${esc(tag)}" title="重新命名">✎</button></div>`).join('');
      $('filterList').innerHTML=untaggedRow+tagRows+(tags.length?'':'<p class="count">尚未建立其他標籤。</p>');
      $('countdownFilter').addEventListener('change',event=>{
        state.countdownFilter=event.target.checked;
        save();resetNavigation(true);
      });
      $('untaggedFilter').addEventListener('change',event=>{
        state.untaggedFilter=event.target.checked;
        save();resetNavigation(true);
      });
      document.querySelectorAll('[data-tag]').forEach(el=>el.addEventListener('change',()=>{
        const tag=el.dataset.tag;
        state.selectedTags=el.checked?[...new Set([...state.selectedTags,tag])]:state.selectedTags.filter(t=>t!==tag);
        save();resetNavigation(true);
      }));
      document.querySelectorAll('[data-rename-tag]').forEach(button=>button.addEventListener('click',()=>renameTag(button.dataset.renameTag)));
    }
    function renameTag(oldTag){
      const input=prompt(`將標籤「${oldTag}」重新命名為：`,oldTag);
      if(input===null)return;
      const newName=input.trim();
      if(!newName)return alert('標籤名稱不能留白。');
      if(newName.length>40)return alert('標籤名稱請控制在 40 個字元以內。');
      if(newName===oldTag)return;
      const matched=allTags().find(([tag])=>tag!==oldTag&&tag.toLocaleLowerCase()===newName.toLocaleLowerCase());
      const finalName=matched?matched[0]:newName;
      if(matched&&!confirm(`標籤「${finalName}」已存在。要將「${oldTag}」合併到「${finalName}」嗎？`))return;
      let changed=0;
      state.entries.forEach(entry=>{
        if(!(entry.tags||[]).includes(oldTag))return;
        entry.tags=[...new Set(entry.tags.map(tag=>tag===oldTag?finalName:tag))];
        changed++;
      });
      state.selectedTags=[...new Set(state.selectedTags.map(tag=>tag===oldTag?finalName:tag))];
      modalTags=[...new Set(modalTags.map(tag=>tag===oldTag?finalName:tag))];
      save();render();showToast(matched?`已合併標籤，共更新 ${changed} 筆項目`:`標籤已重新命名，共更新 ${changed} 筆項目`);
    }
    function renderCalendar(){
      const visible=visibleYearEntries(),now=new Date(),yearAll=state.entries.filter(e=>(entryPeriod(e)||'').startsWith(state.year+'-'));
      const loggedCount=yearAll.filter(e=>e.status==='logged').length,pendingCount=yearAll.filter(e=>e.status==='pending').length;
      $('stats').innerHTML=`日期記事 <strong>${loggedCount}</strong> 筆 · 待辦 <strong>${pendingCount}</strong> 筆${state.selectedTags.length||state.untaggedFilter||state.countdownFilter||state.query||state.statusFilter!=='all'?`，目前顯示 <strong>${visible.length}</strong> 筆`:''}`;
      $('calendar').innerHTML=months.map((name,m)=>{
        const days=new Date(state.year,m+1,0).getDate(),monthKey=monthString(state.year,m);
        const logged=visible.filter(e=>e.status==='logged'&&e.date.slice(0,7)===monthKey);
        const pending=visible.filter(e=>e.status==='pending'&&e.month===monthKey);
        const allLogged=state.entries.filter(e=>e.status==='logged'&&e.date.slice(0,7)===monthKey).length;
        const allPending=state.entries.filter(e=>e.status==='pending'&&e.month===monthKey).length;
        const overdue=allPending>0&&monthKey<monthString(now.getFullYear(),now.getMonth());
        const rows=Array.from({length:days},(_,i)=>{
          const d=i+1,date=dateString(state.year,m,d),dow=new Date(state.year,m,d).getDay();
          const cards=logged.filter(e=>e.date===date).map(entryCard).join('');
          const today=now.getFullYear()===state.year&&now.getMonth()===m&&now.getDate()===d;
          const weekendClass=dow===6?' saturday':dow===0?' sunday':'';
          return `<div class="day-row${today?' today':''}${weekendClass}" data-date="${date}"><div class="date-cell${dow===0||dow===6?' weekend':''}"><strong>${d}</strong><span>週${weekdays[dow]}</span></div><div class="entries">${cards}<button class="row-add" data-add-date="${date}" aria-label="${m+1}月${d}日新增記事">＋</button></div></div>`;
        }).join('');
        const todoCards=pending.map(entryCard).join('');
        const todoContent=todoCards||`<div class="todo-empty">${state.statusFilter==='logged'&&allPending?'待辦已由狀態篩選隱藏':'尚無待辦，可新增或拖曳至此'}</div>`;
        return `<article class="month"><header class="month-head"><h2>${name}</h2><span class="month-meta">記事 ${allLogged}</span><button class="todo-count${allPending?' has-todos':''}${overdue?' overdue':''}" data-jump-month="${monthKey}">待辦 ${allPending}</button></header><div class="month-columns"><span>日期</span><span>日期記事</span></div>${rows}<section class="todo-zone" data-todo-month="${monthKey}"><div class="todo-head"><strong>本月待辦</strong><span>確定時程後拖到日期</span><button class="todo-add" data-add-month="${monthKey}">＋新增待辦</button></div>${todoContent}</section></article>`;
      }).join('');
      renderSheetHeader();bindCalendar();
    }
    function entryCard(e){
      const first=(e.tags||[])[0]||'一般',color=e.status==='pending'?'#d7a74e':tagColor(first);
      const special=(e.tags||[]).includes('休假')?' vacation':(e.tags||[]).includes('代理')?' substitute':'';
      return `<button class="entry${e.status==='pending'?' pending':''}${special}" draggable="true" data-entry-id="${e.id}" style="--tag-color:${color};--tag-soft:${softColor(tagColor(first))}">${e.status==='pending'?'<span class="entry-state">待辦</span>':''}<div class="entry-title">${esc(e.title)}</div><div class="countdown-slot">${countdownMarkup(e)}</div>${e.description?`<div class="entry-desc">${esc(e.description)}</div>`:''}${(e.tags||[]).length?`<div class="entry-tags">${e.tags.map(t=>`<span class="mini-tag">${esc(t)}</span>`).join('')}</div>`:''}</button>`;
    }
    function bindDragCard(card){
      card.addEventListener('click',()=>openModal(card.dataset.entryId));
      card.addEventListener('dragstart',e=>{card.classList.add('dragging');e.dataTransfer.setData('text/plain',card.dataset.entryId);e.dataTransfer.effectAllowed='move'});
      card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    }
    function bindDropZone(zone,onDrop){
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop-target');e.dataTransfer.dropEffect='move'});
      zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('drop-target')});
      zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop-target');onDrop(e.dataTransfer.getData('text/plain'))});
    }
    function bindCalendar(){
      document.querySelectorAll('[data-add-date]').forEach(b=>b.addEventListener('click',()=>openModal(null,b.dataset.addDate,null,'logged')));
      document.querySelectorAll('[data-add-month]').forEach(b=>b.addEventListener('click',()=>openModal(null,null,b.dataset.addMonth,'pending')));
      document.querySelectorAll('[data-jump-month]').forEach(b=>b.addEventListener('click',()=>document.querySelector(`[data-todo-month="${b.dataset.jumpMonth}"]`).scrollIntoView({behavior:'smooth',block:'center'})));
      document.querySelectorAll('[data-entry-id]').forEach(bindDragCard);
      document.querySelectorAll('.day-row').forEach(row=>bindDropZone(row,id=>{
        const entry=state.entries.find(x=>x.id===id);if(!entry)return;
        entry.status='logged';entry.date=row.dataset.date;delete entry.month;save();render();showToast(`已安排於 ${formatDate(entry.date)}`);
      }));
      document.querySelectorAll('.todo-zone').forEach(zone=>bindDropZone(zone,id=>{
        const entry=state.entries.find(x=>x.id===id);if(!entry)return;
        entry.status='pending';entry.month=zone.dataset.todoMonth;delete entry.date;save();render();showToast(`已移至 ${formatMonth(entry.month)}待辦`);
      }));
    }
    function formatDate(s){const [y,m,d]=s.split('-');return `${y}/${Number(m)}/${Number(d)}`}
    function formatMonth(s){const [y,m]=s.split('-');return `${y}/${Number(m)} `}
    function backupTimestamp(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`}
    function setModalType(status){
      document.querySelector(`input[name="entryStatus"][value="${status}"]`).checked=true;
      $('dateField').classList.toggle('hidden',status==='pending');
      $('monthField').classList.toggle('hidden',status!=='pending');
      $('countdownHint').textContent=status==='pending'?'可先勾選；月份待辦不顯示倒數，拖到日期格後會自動開始。':'依今天日期計算，明天為 1 天；當天顯示「今天」，過期後隱藏。';
    }
    function sameAsCopySource(source,data){
      if(!source)return false;
      const sourceTags=[...(source.tags||[])].sort(),dataTags=[...(data.tags||[])].sort();
      const samePeriod=data.status==='pending'?source.status==='pending'&&source.month===data.month:source.status==='logged'&&source.date===data.date;
      return samePeriod&&(source.showCountdown===true)===(data.showCountdown===true)&&source.title===data.title&&String(source.description||'')===data.description&&JSON.stringify(sourceTags)===JSON.stringify(dataTags);
    }
    function openModal(id,date,month,mode){
      const entry=id?state.entries.find(e=>e.id===id):null;
      copySourceId='';$('copyNotice').classList.add('hidden');$('saveEntryBtn').textContent='儲存項目';
      const status=entry?.status||mode||'logged';
      const now=new Date(),fallbackDate=now.getFullYear()===state.year?dateString(state.year,now.getMonth(),now.getDate()):dateString(state.year,0,1);
      $('entryId').value=entry?.id||'';$('entryDate').value=entry?.date||date||fallbackDate;$('entryMonth').value=entry?.month||month||($('entryDate').value.slice(0,7));
      $('entryTitle').value=entry?.title||'';$('entryDesc').value=entry?.description||'';$('entryTags').value='';modalTags=[...(entry?.tags||[])];renderTagPicker();
      $('entryCountdown').checked=entry?.showCountdown===true;
      setModalType(status);$('modalTitle').textContent=entry?(status==='pending'?'編輯待辦':'編輯日期記事'):(status==='pending'?'新增本月待辦':'新增日期記事');
      $('deleteBtn').style.visibility=entry?'visible':'hidden';$('postponeBtn').style.display=entry&&status==='pending'?'inline-block':'none';$('copyBtn').style.display=entry?'inline-block':'none';
      $('modalBackdrop').classList.add('open');setTimeout(()=>$('entryTitle').focus(),50);
    }
    function startCopy(){
      const source=state.entries.find(entry=>entry.id===$('entryId').value);if(!source)return;
      copySourceId=source.id;$('entryId').value='';$('copyNotice').classList.remove('hidden');
      $('modalTitle').textContent=source.status==='pending'?'建立待辦副本':'建立日期記事副本';
      $('deleteBtn').style.visibility='hidden';$('postponeBtn').style.display='none';$('copyBtn').style.display='none';$('saveEntryBtn').textContent='新增副本';
      setTimeout(()=>(source.status==='pending'?$('entryMonth'):$('entryDate')).focus(),30);
    }
    function closeEntryModal(){copySourceId='';$('modalBackdrop').classList.remove('open')}
    function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    function closeMenu(){$('settingsMenu').classList.remove('open');$('settingsBtn').setAttribute('aria-expanded','false')}

    document.querySelectorAll('input[name="entryStatus"]').forEach(r=>r.addEventListener('change',()=>setModalType(r.value)));
    $('entryForm').addEventListener('submit',e=>{
      e.preventDefault();
      const id=$('entryId').value,status=document.querySelector('input[name="entryStatus"]:checked').value;
      commitTagInput();
      const data={status,title:$('entryTitle').value.trim(),description:$('entryDesc').value.trim(),tags:[...modalTags],showCountdown:$('entryCountdown').checked};
      if(!data.title)return;
      if(status==='pending'){if(!$('entryMonth').value)return alert('請選擇所屬月份。');data.month=$('entryMonth').value}else{if(!$('entryDate').value)return alert('請選擇指定日期。');data.date=$('entryDate').value}
      const wasCopy=Boolean(copySourceId),source=wasCopy?state.entries.find(item=>item.id===copySourceId):null;
      if(wasCopy&&sameAsCopySource(source,data)&&!confirm('副本的日期與內容都和原項目相同，仍要新增嗎？'))return;
      const found=state.entries.find(x=>x.id===id);
      let created=null;
      if(found){Object.assign(found,data);if(status==='pending')delete found.date;else delete found.month}else{created={...data,id:uid(),createdAt:Date.now()};state.entries.push(created)}
      state.year=Number((status==='pending'?data.month:data.date).slice(0,4));save();closeEntryModal();if(created)navEntryId=created.id;render();if(created&&isVisible(created))requestAnimationFrame(()=>requestAnimationFrame(()=>markNavigationCard(true)));showToast(found?'項目已更新':wasCopy?'副本已新增':status==='pending'?'待辦已新增':'日期記事已新增');
    });
    $('deleteBtn').addEventListener('click',()=>{const id=$('entryId').value;if(id&&confirm('確定刪除這筆項目？')){state.entries=state.entries.filter(e=>e.id!==id);save();closeEntryModal();render();showToast('項目已刪除')}});
    $('postponeBtn').addEventListener('click',()=>{const entry=state.entries.find(e=>e.id===$('entryId').value);if(!entry||entry.status!=='pending')return;const [y,m]=entry.month.split('-').map(Number),next=new Date(y,m,1);entry.month=monthString(next.getFullYear(),next.getMonth());state.year=next.getFullYear();save();closeEntryModal();render();showToast(`已延至 ${formatMonth(entry.month)}待辦`)});
    $('copyBtn').addEventListener('click',startCopy);$('addBtn').addEventListener('click',()=>openModal());$('closeModal').addEventListener('click',closeEntryModal);$('cancelBtn').addEventListener('click',closeEntryModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeEntryModal()});
    $('entryTags').addEventListener('focus',()=>{$('tagPicker').classList.add('open');renderTagPicker()});
    $('entryTags').addEventListener('input',renderTagPicker);
    $('entryTags').addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===','||e.key==='，'){e.preventDefault();commitTagInput()}
      else if(e.key==='Backspace'&&!$('entryTags').value&&modalTags.length){e.preventDefault();modalTags.pop();renderTagPicker()}
      else if(e.key==='Escape')$('tagPicker').classList.remove('open');
    });
    document.addEventListener('click',e=>{if(!$('tagPicker').contains(e.target))$('tagPicker').classList.remove('open')});
    function jumpToDate(date){
      if(calendarDayNumber(date)===null){alert('請先選擇有效日期。');return}
      state.year=Number(date.slice(0,4));save();render();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const row=document.querySelector(`[data-date="${date}"]`);
        if(row)row.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
      }));
    }
    $('prevYear').addEventListener('click',()=>{state.year--;save();render()});$('nextYear').addEventListener('click',()=>{state.year++;save();render()});$('todayBtn').addEventListener('click',()=>{
      const now=new Date(),today=dateString(now.getFullYear(),now.getMonth(),now.getDate());
      $('jumpDate').value=today;jumpToDate(today);
    });
    $('jumpDateBtn').addEventListener('click',()=>jumpToDate($('jumpDate').value));
    $('jumpDate').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jumpToDate(e.target.value)}});
    $('searchInput').addEventListener('input',e=>{state.query=e.target.value;navEntryId='';render();clearTimeout(searchNavTimer);searchNavTimer=setTimeout(()=>{const first=navigationEntries()[0];if(first)focusNavigationEntry(first.id,true)},220)});$('clearFilters').addEventListener('click',()=>{state.selectedTags=[];state.untaggedFilter=false;state.countdownFilter=false;state.query='';state.statusFilter='all';navEntryId='';$('searchInput').value='';setResultListOpen(false);save();render()});
    document.querySelectorAll('.seg-btn').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;save();render()}));document.querySelectorAll('.status-btn').forEach(b=>b.addEventListener('click',()=>{state.statusFilter=b.dataset.status;save();resetNavigation(true)}));
    $('prevResult').addEventListener('click',()=>moveNavigation(-1));$('nextResult').addEventListener('click',()=>moveNavigation(1));$('listResultsBtn').addEventListener('click',e=>{e.stopPropagation();setResultListOpen($('resultList').classList.contains('hidden'))});
    $('settingsBtn').addEventListener('click',e=>{e.stopPropagation();$('settingsMenu').classList.toggle('open');$('settingsBtn').setAttribute('aria-expanded',$('settingsMenu').classList.contains('open'))});document.addEventListener('click',e=>{if(!$('settingsMenu').contains(e.target)&&e.target!==$('settingsBtn'))closeMenu();if(!$('resultNav').contains(e.target))setResultListOpen(false)});
    $('mobileFilterBtn').addEventListener('click',()=>{$('sidebar').style.cssText='display:block;position:fixed;z-index:50;inset:0 auto 0 0;width:280px;height:100vh;top:0;box-shadow:12px 0 30px rgba(0,0,0,.2)';$('sidebar').addEventListener('click',e=>{if(e.target.matches('input,button'))setTimeout(()=>$('sidebar').removeAttribute('style'),150)},{once:true})});
    $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),entries:state.entries},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工作日誌備份_${backupTimestamp()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);closeMenu();showToast('備份已匯出')});
    $('importInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.entries))throw Error();if(confirm(`備份內有 ${data.entries.length} 筆項目。要取代目前資料嗎？`)){state.entries=data.entries.map(normalizeEntry);save();render();showToast('備份已匯入')}}catch(err){alert('無法讀取這份備份，請確認是本工具匯出的 JSON 檔。')}e.target.value='';closeMenu()});
    $('resetBtn').addEventListener('click',()=>{if(confirm('要清除目前資料並恢復附件範例嗎？')){state.entries=seed.map(normalizeEntry);state.year=2026;state.selectedTags=[];state.untaggedFilter=false;state.countdownFilter=false;state.query='';state.statusFilter='all';save();render();showToast('已恢復範例')}});$('printBtn').addEventListener('click',()=>{closeMenu();window.print()});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){closeEntryModal();closeMenu();setResultListOpen(false);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal();return}
      const target=e.target,typing=target.matches('input,textarea,select,[contenteditable="true"],button,a')||$('modalBackdrop').classList.contains('open');
      if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
      if(hasActiveFilter()&&e.key.toLowerCase()==='p'){e.preventDefault();moveNavigation(-1)}
      else if(hasActiveFilter()&&e.key.toLowerCase()==='n'){e.preventDefault();moveNavigation(1)}
      else if(hasActiveFilter()&&e.key==='Enter'&&navEntryId){e.preventDefault();openModal(navEntryId)}
    });
    $('calendar').addEventListener('scroll',syncSheetHeader,{passive:true});window.addEventListener('resize',syncSheetHeader);if('ResizeObserver'in window)new ResizeObserver(syncSheetHeader).observe(document.querySelector('.topbar'));load();render();scheduleCountdownRefresh();
    const initialNow=new Date();$('jumpDate').value=dateString(initialNow.getFullYear(),initialNow.getMonth(),initialNow.getDate());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeCountdowns()});window.addEventListener('focus',resumeCountdowns);
  </script>
